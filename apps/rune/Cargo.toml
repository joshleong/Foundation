# Foundation's board, drawn by Rune (github.com/anomalyco/rune): a GPU renderer with its own
# layout, text and springs, built to wasm and mounted on a canvas beside the web UI.
# Its own Cargo workspace: nothing here touches the Tauri crate (apps/client/src-tauri).
# Build: `npm run rune:build` (scripts/rune.mjs) -> apps/client/public/rune/.
[package]
name = "foundation-rune"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Rune is pre-release: pin a rev of `dev` (never rewritten). Bump all six revs together.
rune = { git = "https://github.com/anomalyco/rune", rev = "a3669283c49b7f01cd1dbd7f3d9abc7f31e2f97c" }
# Rune's own kit, for a note's markdown (the same rev: bump it with the others)
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a3669283c49b7f01cd1dbd7f3d9abc7f31e2f97c", default-features = false, features = ["markdown"] }
# a note's blocks, to space them as the web note does (the kit's parser, the same options)
pulldown-cmark = { version = "0.13", default-features = false }
# the paper's own pass (src/paper.rs): the wgpu Rune draws with, and the features it asks for
wgpu = { version = "30", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# the CLI that makes the JS glue must be this exact version (scripts/rune.mjs checks)
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

# Rune builds against patched copies of these; a dependency's [patch] doesn't reach us, so repeat it.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "a3669283c49b7f01cd1dbd7f3d9abc7f31e2f97c" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "a3669283c49b7f01cd1dbd7f3d9abc7f31e2f97c" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "a3669283c49b7f01cd1dbd7f3d9abc7f31e2f97c" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "a3669283c49b7f01cd1dbd7f3d9abc7f31e2f97c" }

[profile.release]
# for speed: measured here, it is also the smaller build (10.7 MB against 13.7 at "s")
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0
strip = "debuginfo"
