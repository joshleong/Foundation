<!doctype html>
<meta charset="utf-8" />
<title>Live frame (test)</title>
<style>html,body{margin:0;height:100%;background:#0d1526;color:#94a2b9;font:12px system-ui}canvas{display:block;width:100%;height:100%}</style>
<canvas id="c"></canvas>
<script>
  // a stand-in live app for the perf trace: a canvas that draws every frame
  const c = document.getElementById("c"), g = c.getContext("2d");
  let t = 0;
  (function draw() {
    c.width = c.clientWidth; c.height = c.clientHeight;
    g.fillStyle = "#54b8ee";
    for (let i = 0; i < 40; i++) g.fillRect((i * 37 + t) % c.width, (i * 23) % c.height, 6, 6);
    t += 2;
    requestAnimationFrame(draw);
  })();
</script>
